<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Company-Project-API 데이터 격리 계층</title>
<desc>회사, 프로젝트, API가 중첩된 격리 구조로 표현되며 각 프로젝트에 역할이 배정되는 구조</desc>

<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>

<rect x="40" y="40" width="600" height="300" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">Company</text>
<text x="60" y="84" font-family="sans-serif" font-size="12" fill="#3B6D11">게임사 단위, 최상위 격리</text>

<rect x="70" y="110" width="270" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="90" y="132" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Project A</text>
<text x="90" y="150" font-family="sans-serif" font-size="12" fill="#0F6E56">게임 타이틀 단위</text>

<rect x="360" y="110" width="260" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="380" y="132" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Project B</text>
<text x="380" y="150" font-family="sans-serif" font-size="12" fill="#0F6E56">api_base_url 별도 지정</text>

<rect x="90" y="180" width="220" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="200" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">API 정의 목록</text>

<text x="200" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">api_stage: 20/30/40</text>
<text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">개발 / 승인 / 운영</text>

<rect x="90" y="278" width="220" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">user_role: 프로젝트별 배정</text>

<text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">동일 구조 반복</text>
</svg>
