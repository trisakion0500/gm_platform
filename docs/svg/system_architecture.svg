<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GM Platform 시스템 아키텍처</title>
<desc>React 클라이언트, Claude(MCP), Backend server, MySQL(메인/로그 물리 분리), Redis, rag_server, Qdrant, test_game_server 간의 연결 구조</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1000" height="540" fill="#FFFFFF"/>

<!-- Row 1: Client / Claude -->
<rect x="60" y="30" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="170" y="51" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Client (React)</text>
<text x="170" y="69" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Vite / AntD / Zustand</text>

<rect x="700" y="30" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="820" y="51" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Claude (Code / Desktop)</text>
<text x="820" y="69" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">MCP 클라이언트</text>

<!-- Row 2: mcp servers -->
<line x1="760" y1="86" x2="725" y2="120" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="880" y1="86" x2="905" y2="120" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="820" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">stdio (JSON-RPC)</text>

<rect x="650" y="120" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="725" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">mcp_server_dev</text>
<text x="725" y="159" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">tool 10개</text>

<rect x="830" y="120" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="905" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">mcp_server_pc</text>
<text x="905" y="159" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">tool 30개(admin 포함)</text>

<!-- Client / mcp -> Backend -->
<line x1="170" y1="86" x2="400" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="725" y1="176" x2="560" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="905" y1="176" x2="590" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="700" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">REST API (JWT)</text>

<!-- Row 3: Backend server -->
<rect x="350" y="220" width="260" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="243" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Backend server/</text>
<text x="480" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Express + TS, REST API</text>

<!-- Backend -> 5 services -->
<line x1="400" y1="280" x2="110" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="230" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">SP/Function 호출</text>

<line x1="440" y1="280" x2="295" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">세션·리미터·참조캐시</text>

<line x1="480" y1="280" x2="480" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="500" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">감사로그(별도 트랜잭션)</text>

<line x1="520" y1="280" x2="665" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="620" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">검색 프록시</text>

<line x1="560" y1="280" x2="850" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="750" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">S2S 실행 (X-API-Key)</text>

<!-- Row 4: 5 services -->
<rect x="25" y="340" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="110" y="361" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">MySQL (main)</text>
<text x="110" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">gm_platform, SP/Function 전용</text>

<rect x="210" y="340" width="170" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="295" y="361" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Redis</text>
<text x="295" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">REDIS_ENABLED 폴백</text>

<rect x="395" y="340" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="480" y="361" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">MySQL (log)</text>
<text x="480" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">gm_platform_log, 물리 분리</text>

<rect x="580" y="340" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="665" y="361" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">rag_server :3200</text>
<text x="665" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">docs/api/log 검색</text>

<rect x="765" y="340" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="850" y="361" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">test_game_server :3100</text>
<text x="850" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">S2S 검증용 목업 서버</text>

<!-- rag_server -> Qdrant -->
<line x1="665" y1="396" x2="665" y2="450" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="710" y="428" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">alias 스왑</text>

<rect x="580" y="450" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="665" y="471" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Qdrant</text>
<text x="665" y="489" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">gm_docs / gm_apis / gm_logs</text>

<!-- rag_server <-> MySQL(main): advisory lock share -->
<path d="M580 396 L580 420 L110 420 L110 396" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text x="345" y="435" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">advisory lock 공유</text>
</svg>
